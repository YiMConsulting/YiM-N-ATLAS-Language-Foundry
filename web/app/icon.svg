<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Inner Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#334155" stroke-dasharray="2 4" stroke-width="1"/>

  <!-- Stylized Geometric "N" Nexus -->
  <!-- Left Pillar -->
  <path d="M 20 18 L 26 18 L 26 46 L 20 46 Z" fill="url(#accentGrad)" rx="2"/>
  
  <!-- Diagonal Slash -->
  <path d="M 24 18 L 40 44 L 40 46 L 34 46 L 20 22 L 20 18 Z" fill="url(#glowGrad)"/>
  
  <!-- Right Pillar -->
  <path d="M 38 18 L 44 18 L 44 46 L 38 46 Z" fill="url(#accentGrad)" rx="2"/>

  <!-- Atlas / Spark Core Dot -->
  <circle cx="41" cy="21" r="3" fill="#10b981"/>
  <circle cx="23" cy="43" r="2.5" fill="#3b82f6"/>
</svg>
