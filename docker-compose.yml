services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: natlas-foundry-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./data:/app/data:z
      - ./experiments:/app/experiments:z
      - ./outputs:/app/outputs:z
      - ./api:/app/api:z
      - ./tests:/app/tests:z
      - ./foundry:/app/foundry:z

    restart: unless-stopped
