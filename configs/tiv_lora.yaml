id: tiv-lora-v1
language_code: tiv
base_model: NCAIR1/N-ATLaS

dataset_ids:
  - tiv-mt560-v1
split_id: tiv-mt560-v1-split-42

adaptation:
  method: lora
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj

training:
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  epochs: 1
  warmup_ratio: 0.03
  weight_decay: 0.01
  seed: 42

runtime:
  hardware: Tesla T4
  device: cuda
  precision: fp16
